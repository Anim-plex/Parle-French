name: Build APK

# Builds a debug APK on every push / PR so the app can be downloaded and
# installed without Android Studio (Actions → run → Artifacts).
#
# NOTE: the repo ships gradle/wrapper/gradle-wrapper.properties but no
# gradlew script or wrapper jar, so this workflow installs Gradle 9.3.1
# directly (the version the wrapper properties pin).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Gradle 9.3.1
        run: |
          curl -sSLo "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # Optional: without app/google-services.json the build still succeeds
      # (missingGoogleServicesStrategy = WARN) but the app crashes on launch.
      # The file is committed, so this is only an override for when a
      # GOOGLE_SERVICES_JSON secret (base64 of the file) is configured.
      # NOTE: 'secrets' is not allowed in step-level `if:` expressions,
      # hence the shell-side guard instead of an `if:` condition.
      - name: Inject google-services.json from secret (if configured)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
            echo "Injected google-services.json from secret."
          else
            echo "No GOOGLE_SERVICES_JSON secret — using committed file (if any)."
          fi

      # build.gradle.kts signs debug builds with ${rootDir}/debug.keystore,
      # but that file is gitignored — reproduce the standard Android debug
      # keystore in CI so :app:validateSigningDebug can pass.
      - name: Create debug keystore (gitignored, absent from repo)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parle-french-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
